spring.application.name=demo

# Banco de dados PostgreSQL
# Em producao (Render), defina DB_URL, DB_USERNAME e DB_PASSWORD nas variaveis de ambiente.
# Os valores depois do ":" sao usados so quando a variavel nao existe (rodando local).
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/demo_blog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:darius667}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracoes adicionais recomendadas
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Porta: o Render passa a variavel PORT; local continua 8443
server.port=${PORT:8443}

# HTTPS proprio so local. Em producao o Render ja cuida do HTTPS (SSL_ENABLED=false no Dockerfile)
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:demo-keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:123456}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=teste
